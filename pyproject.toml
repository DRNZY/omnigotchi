[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omnigotchi"
version = "1.0.0"
description = "All-in-One Autonomous E-Ink Cyberpet & Desk Companion for Raspberry Pi"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pillow>=10.0.0",
    "aiohttp>=3.9.0",
    "psutil>=5.9.0",
]

[tool.setuptools.packages.find]
include = ["omnigotchi*"]
